# npm trust github @gesagro/biomejs --file npm-publish.yaml --repo ges-agro/biomejs --allow-publish

name: npm-publish

on:
  push:
    branches:
      - main

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check generated is up to date
        run: npm run build && git diff --exit-code generated

      - name: Check if version is new
        id: version
        run: npm view "$(jq -r '.name + "@" + .version' package.json)" version || echo "new=true" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: npm publish
